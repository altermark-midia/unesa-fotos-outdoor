name: Baixar fotos do Drive
on:
  push:
    paths: ['ids.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick libheif-examples >/dev/null
      - name: Baixar e reduzir fotos
        run: |
          mkdir -p fotos
          : > falhas.txt
          while read -r id; do
            id=$(echo "$id" | tr -d '\r ')
            [ -z "$id" ] && continue
            [ -f "fotos/$id.jpg" ] && continue
            ok=0
            for u in "https://drive.google.com/uc?export=download&id=$id" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" "https://lh3.googleusercontent.com/d/$id=s0"; do
              rm -f tmp
              curl -sSL --max-time 90 -A "Mozilla/5.0" -o tmp "$u" || continue
              mt=$(file -b --mime-type tmp)
              case "$mt" in image/*) ;; *) continue;; esac
              if convert tmp -auto-orient -resize '1600x1600>' -quality 85 "fotos/$id.jpg" 2>/dev/null; then ok=1; break; fi
              if [ "$mt" = "image/heic" ] || [ "$mt" = "image/heif" ]; then heif-convert tmp tmp.jpg >/dev/null 2>&1 && convert tmp.jpg -auto-orient -resize '1600x1600>' -quality 85 "fotos/$id.jpg" && ok=1 && break; fi
            done
            [ $ok = 1 ] || echo "$id" >> falhas.txt
          done < ids.txt
          rm -f tmp tmp.jpg
          ls fotos > manifesto.txt
          echo "ok: $(wc -l < manifesto.txt)  falhas: $(wc -l < falhas.txt)"
      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Fotos baixadas do Drive" || echo "nada novo"
          git push
